[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiter-equity-trading"
version = "0.1.0"
description = "Private Indian-market paper trading and strategy research service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
jupiter-api = "jupiter_trading.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Python 3.9 compatibility requires typing.Optional/List/Dict rather than 3.10 syntax.
# FastAPI intentionally uses Query() as a parameter default.
ignore = ["B008", "UP006", "UP035", "UP045"]
